spring.application.name=dependency-hell
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dependency_hell}
spring.datasource.username=${DB_USER:hell}
spring.datasource.password=${DB_PASSWORD:hell_local}
spring.flyway.locations=classpath:db/migration
registry.adapter.url=${REGISTRY_ADAPTER_URL:http://localhost:8081}
spring.jackson.deserialization.fail-on-unknown-properties=true
