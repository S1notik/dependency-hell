[package]
name = "dependency-hell-graph"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dependency-hell-graph"
path = "main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json"] }
