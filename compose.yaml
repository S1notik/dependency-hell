services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dependency_hell
      POSTGRES_USER: hell
      POSTGRES_PASSWORD: hell_local
    volumes:
      - dependency_hell_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hell -d dependency_hell"]
      interval: 3s
      timeout: 3s
      retries: 20
  registry:
    build:
      context: ./go/stage2
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health"]
      interval: 3s
      timeout: 3s
      retries: 20
  graph:
    build:
      context: ./rust/stage3
      dockerfile: Dockerfile
    environment:
      SPRING_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "/graph", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
  versions:
    build:
      context: ./csharp/stage3
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "dotnet", "/app/Resolver.dll", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
  tree:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8084/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dependency_hell
      DB_USER: hell
      DB_PASSWORD: hell_local
      REGISTRY_ADAPTER_URL: http://registry:8081
      GRAPH_SERVICE_URL: http://graph:8082
      VERSION_RESOLVER_URL: http://versions:8083
      TREE_SERVICE_URL: http://tree:8084
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
      graph:
        condition: service_healthy
      versions:
        condition: service_healthy
      tree:
        condition: service_healthy
volumes:
  dependency_hell_data:
