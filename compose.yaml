services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dependency_hell
      POSTGRES_USER: hell
      POSTGRES_PASSWORD: hell_local
    volumes:
      - dependency_hell_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hell -d dependency_hell"]
      interval: 3s
      timeout: 3s
      retries: 20
  registry:
    build:
      context: ./go/stage2
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dependency_hell
      DB_USER: hell
      DB_PASSWORD: hell_local
      REGISTRY_ADAPTER_URL: http://registry:8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
volumes:
  dependency_hell_data:
